# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: ExperimentalMode
    widget: toggle
    title: Experimental Mode
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DynamicExperimentalControl
    widget: toggle
    title: Dynamic Experimental Control
    description: Let the model decide when to use sunnypilot ACC or sunnypilot End to End Longitudinal.
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button. On a Rivian with sunnypilot
      longitudinal, Following Distance sets the gap instead and the right scroll wheel changes that; the personality
      then only sets how firmly it accelerates and brakes, the pull-away limit below and how much Keep Up With Traffic
      adds. Pulling away from a stop, the gas is also limited by personality, up to about 9 mph, easing back to the
      normal limit by 27 mph. Aggressive is limited to 1.4 m/s², Standard 1.2 and Relaxed 1.0. Before this it was 1.6,
      or 2.0 when the driving model is in control. Behind a car pulling away it is the same, unless Keep Up With Traffic
      lifts it.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: RivianFollowDistance
    widget: multiple_button
    title: Following Distance
    description: 'How far behind the car ahead sunnypilot follows: Closer 1.00 s, Close 1.10 s, Medium 1.25 s (the gap
      Aggressive had) and Far 1.45 s (Standard''s), before the Following Distance Offset. With the offset at -10%,
      at 65 mph that is about 105, 114, 127 and 144 ft. Roll the right scroll wheel up for farther and down for closer
      while sunnypilot is engaged or the truck is stopped; it stops at Closer and Far, and each notch shows the distance
      on the screen. Each step eases in over 1 to 2 seconds. Closer and Close also react faster when the car ahead
      brakes: as soon as the radar shows it, sunnypilot plans with that instead of waiting for the smoothed estimate,
      which wins back most of the room the shorter gaps give up when that car brakes hard. Traffic Mode keeps its own
      shorter gap but never follows farther back than this. The Driving Personality still sets how firmly it
      accelerates and brakes. Rivian with sunnypilot longitudinal only. Can be changed while driving.'
    options:
    - value: 0
      label: Closer
    - value: 1
      label: Close
    - value: 2
      label: Medium
    - value: 3
      label: Far
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: SPFollowingTimeOffset
    widget: option
    title: Following Distance Offset
    description: Adjusts the gap to the car ahead in every driving personality and Following Distance, from -10%
      (closer) to +10% (further) in 2% steps. 0 is no change. With Experimental mode off, on Aggressive at 70 mph each 2% step is about 2.6 ft
      (10% is about 13 ft). In Experimental mode the driving model can keep its own gap, so the change may be smaller
      or not noticeable. Takes effect on the next drive.
    min: -10
    max: 10
    step: 2
    unit: '%'
    needs_onroad_cycle: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
  - key: TrafficMode
    widget: toggle
    title: Traffic Mode
    description: 'Shorter gap for stop-and-go traffic, closest at town speeds: about 0.6 s behind the car ahead when
      nearly stopped, 0.8 s from about 11 to 20 mph, 0.9 s at 30 mph and 1.0 s from 40 mph up, as before at highway
      speed (Aggressive and Following Distance Medium are 1.25 s). At 10, 20 and 30 mph it follows about 31, 43 and
      59 ft back, against 33, 49 and 64 ft before, and it still stops about 13 ft behind a stopped car. Stopped behind a
      car, it moves off sooner when that car creeps away slowly, and it follows a car that only inches forward instead
      of waiting for the gap to open up; the closer it stopped, the less head start it takes. It accelerates more
      gently, at most 1.5 m/s² up to 30 mph, Keep Up With Traffic included, back to normal by 40 mph. And it reacts
      sooner when the car ahead brakes, at any speed: it reads that car''s speed from the radar directly instead of
      waiting for the smoothed estimate. Its own gap ignores the Following Distance Offset,
      but on a Rivian it never follows farther back than Following Distance with the offset (at -10%, Closer is 0.90 s
      from 30 mph and Close 0.99 s from 39 mph). Press and hold the right scroll wheel on the steering wheel (its middle
      button) for 1 second to toggle, or tap the T on the comma four home screen while the truck is off. Stays on or
      off until you change it.'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: RedLightStopDistance
    widget: option
    title: Red Light Stop Distance
    description: Stops this far short of where the driving model would stop for a red light (or a stop sign).
      Experimental Mode only, the only mode that stops for lights, and not when stopping behind a car. It adds braking
      on top of the model's, mostly in the last few seconds, never more than 1 m/s² extra, and holds the stop instead
      of creeping up to the line, unless the model keeps asking to creep for 3 seconds. Off leaves the model's stop as
      is. Can be changed while driving.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 1 m (3 ft)
    - value: 2
      label: 2 m (7 ft)
    - value: 3
      label: 3 m (10 ft)
    - value: 4
      label: 4 m (13 ft)
    - value: 5
      label: 5 m (16 ft)
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: KeepPaceWithTraffic
    widget: toggle
    title: Keep Up With Traffic
    description: When a car the radar is tracking pulls away and the gap grows past your following distance,
      sunnypilot may accelerate harder to close it, instead of letting it open up. It builds up over the first 30 ft or
      so past your following distance, and tapers to half the increase from 22 to 45 mph. How much depends on Driving
      Personality. Aggressive goes up to 2.0 m/s² (about 0.2 g) from a stop and at 22 mph, 1.1 at 56 mph. Standard gets
      half of that increase (1.6, 1.6, 0.95) and Relaxed a quarter (1.25, 1.35, 0.9), against the default cap of 1.4,
      1.2 or 1.0 m/s² from a stop (by personality), about 1.2 at 22 mph and 0.8 at 56 mph.
      On radar cruise, only on fairly straight roads. While the driving model is in control (Experimental Mode or
      Dynamic Experimental Control in its end-to-end mode) it lifts the low-speed pull-away limit instead. In Traffic
      Mode it is held to 1.5 m/s² up to 30 mph, easing back to the above by 40 mph. Braking and your following
      distance are unchanged, and with no car ahead the default cap stays. Can be changed while driving.
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: BrakeSoonerForStops
    widget: toggle
    title: Brake Sooner for Stops
    description: Two parts. For stopped or slow cars the radar picks up ahead, in any mode, braking starts sooner and
      builds up more gently. It plans the stop with about 1.5 m/s² of braking instead of 2.5, and the swing from the gas
      into braking eases in. That only applies while a gentle stop is still possible; a car seen late gets the normal,
      firmer braking. The earlier, gentler planned stop fades out between about 22 and 13 mph, so in town it does not slow
      the truck to a walk well short of the car; the ease-in from the gas still applies. For red lights, stop signs and stopped traffic the driving model sees first, Dynamic Experimental
      Control waits until the model wants fairly firm braking before it lets the model slow the truck, and above 37 mph
      that wait gets longer the faster you go. With this on, it hands over about 1.5 seconds sooner at 45 mph and 2.5 to
      3 seconds sooner at 50 to 55 mph. Above 62 mph it keeps the 62 mph setting. With no car ahead it can also hand over
      briefly on a sharp curve, where the model may ease off a little. That second part needs Experimental Mode and
      Dynamic Experimental Control both on. Can be changed while driving.
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: RivianLaunchAssist
    widget: toggle
    title: Launch Assist
    description: A quicker start in the first second of a launch from a stop. Once the truck has been stopped behind
      a radar-tracked car for a second and that car pulls away, sunnypilot asks for at least as much as that car pulls
      away with, from 0.5 m/s² up to the Launch Assist Strength limit, until the truck is under way (its speed reads
      about 0.3 m/s), and then eases back into the normal plan. It eases back sooner once the plan asks for as much,
      when that car stops pulling away, or when the radar loses that car or switches to another, and it never takes
      the truck faster than that car. With no car ahead it adds a smaller lift for up to 2 seconds, never more than the
      driving model plans for the next second. sunnypilot's own stop always wins; a stop request shorter than 0.1 s
      while that car keeps pulling away only pauses it. Behind a car it doesn't lift a launch in Traffic Mode, which
      moves off sooner on its own when that car creeps away, or after stopping closer than 3.5 m (11 ft) to it. With
      Traffic Mode off, behind a car that pulls away briskly, the truck reaches 2 mph about 0.15-0.2 s sooner than
      before; if that car then stops at once, the truck can end up a little closer to it, usually about 0.2 m and up to
      about 0.7 m. Rivian with sunnypilot longitudinal only. Can be changed while driving.
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: RivianLaunchAssistBoost
    widget: multiple_button
    title: Launch Assist Strength
    description: 'How hard Launch Assist may pull. Strong: up to 0.8, 0.7 or 0.6 m/s² behind a car pulling away
      (Aggressive, Standard, Relaxed) and 0.6, 0.5 or 0.4 with no car ahead. Gentle: 0.1 m/s² less in each case, a
      softer start that gets going up to about 0.1 s later behind a car that pulls away briskly and the same behind a
      slower one. With Traffic Mode on it only changes launches with no car ahead. Only with Launch Assist on. Rivian
      with sunnypilot longitudinal only. Can be changed while driving.'
    options:
    - value: 0
      label: Gentle
    - value: 1
      label: Strong
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/longitudinal'
    - type: param
      key: RivianLaunchAssist
      equals: true
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
  sub_panels:
  - id: custom_acc_intervals
    label: Custom ACC Speed Intervals Settings
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection and offset behavior
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Speed Limit Settings
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Speed Limit Assist Mode
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Information
      - value: 2
        label: Warning
      - value: 3
        label: Assist
        enablement:
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Speed Limit Source
      options:
      - value: 0
        label: Car State Only
      - value: 1
        label: Map Data Only
      - value: 2
        label: Car State Priority
      - value: 3
        label: Map Data Priority
      - value: 4
        label: Combined
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Speed Limit Offset Type
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fixed
      - value: 2
        label: Percentage
    - key: SpeedLimitValueOffset
      widget: option
      title: Speed Limit Offset Value
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: Smart Cruise Control
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Vision
    description: Use vision path predictions to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlMap
    widget: toggle
    title: Map
    description: Use map data to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: CurveSpeedControl
    widget: toggle
    title: Curve
    description: Slows down ahead of curves and powers smoothly through them. It plans a speed for the road ahead from
      the driving model's predicted path, no map data needed, for about 2.2 m/s² of cornering, and starts slowing for
      it early, at 1.0 m/s². The model often sees how sharp a curve is only shortly before it, so a sharp curve can
      still be entered faster than planned; it lowers the entry speed rather than guaranteeing it. A second check
      watches how hard the truck is actually cornering, from the steering angle. At 85% of what the steering can hold
      (2.8 m/s² while steering on torque, 3.0 on angle) it brings the speed down, and from 70% it eases off the gas,
      with none at all while the steering cannot hold the line. While it is slowing, a green C shows on the comma four
      road view; on the comma 3/3X a CURVE label shows while it is on and blinks while it is slowing. sunnypilot
      longitudinal only, and turned off when longitudinal is turned off. Can be changed while driving.
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
