# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: ExperimentalMode
    widget: toggle
    title: Experimental Mode
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DynamicExperimentalControl
    widget: toggle
    title: Dynamic Experimental Control
    description: Let the model decide when to use sunnypilot ACC or sunnypilot End to End Longitudinal.
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: SPFollowingTimeOffset
    widget: option
    title: Following Distance Offset
    description: Adjusts the gap to the car ahead in every driving personality, from -10% (closer) to +10% (further)
      in 2% steps. 0 is no change. With Experimental mode off, on Aggressive at 70 mph each 2% step is about 2.6 ft
      (10% is about 13 ft). In Experimental mode the driving model can keep its own gap, so the change may be smaller
      or not noticeable. Takes effect on the next drive.
    min: -10
    max: 10
    step: 2
    unit: '%'
    needs_onroad_cycle: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
  - key: TrafficMode
    widget: toggle
    title: Traffic Mode
    description: 'Shorter gap for stop-and-go traffic: about 0.5 s behind the car ahead when nearly stopped, rising
      to 1.0 s from about 11 mph and staying at 1.0 s at every speed until turned off (Aggressive is 1.25 s). Ignores
      Following Distance Offset while on. Hold the left thumb button on the steering wheel for 1 second to toggle,
      or tap the T on the comma four home screen while the truck is off. Stays on or off until you change it.'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: RedLightStopDistance
    widget: option
    title: Red Light Stop Distance
    description: Stops this far short of where the driving model would stop for a red light (or a stop sign).
      Experimental Mode only, the only mode that stops for lights, and not when stopping behind a car. It adds braking
      on top of the model's, mostly in the last few seconds, never more than 1 m/s² extra, and holds the stop instead
      of creeping up to the line, unless the model keeps asking to creep for 3 seconds. Off leaves the model's stop as
      is. Can be changed while driving.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 1 m (3 ft)
    - value: 2
      label: 2 m (7 ft)
    - value: 3
      label: 3 m (10 ft)
    - value: 4
      label: 4 m (13 ft)
    - value: 5
      label: 5 m (16 ft)
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: KeepPaceWithTraffic
    widget: toggle
    title: Keep Up With Traffic
    description: When a car the radar is tracking pulls away and the gap grows past your following distance,
      sunnypilot may accelerate harder to close it, instead of letting it open up. It builds up over the first 30 ft or
      so past your following distance, and tapers to half the increase from 22 to 45 mph. How much depends on Driving
      Personality. Aggressive goes up to 2.0 m/s² (about 0.2 g) from a stop and at 22 mph, 1.1 at 56 mph. Standard gets
      half of that increase (1.8, 1.6, 0.95) and Relaxed a quarter (1.7, 1.4, 0.9), against the default cap of 1.6 m/s²
      from a stop, 1.2 at 22 mph and 0.8 at 56 mph.
      Only on fairly straight roads, and not while the driving model is in control (Experimental Mode or Dynamic
      Experimental Control in its end-to-end mode). Braking and your following distance are unchanged, and with no car
      ahead the default cap stays. Can be changed while driving.
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: RivianLaunchAssist
    widget: toggle
    title: Launch Assist
    description: Starts the truck moving sooner when the car ahead pulls away from a stop. Once the truck has been
      stopped behind a radar-tracked car for a second and that car starts moving away, sunnypilot briefly raises its
      request to 0.5 m/s² (under a second, ending sooner once the truck matches the car's speed) to get past the
      truck's standstill dead zone, then eases back to the normal plan. Once moving it accelerates as before. Because
      it starts sooner, the truck may also follow a car that only inches forward and stops. Rivian with sunnypilot
      longitudinal only. Can be changed while driving.
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
  sub_panels:
  - id: custom_acc_intervals
    label: Custom ACC Speed Intervals Settings
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection and offset behavior
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Speed Limit Settings
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Speed Limit Assist Mode
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Information
      - value: 2
        label: Warning
      - value: 3
        label: Assist
        enablement:
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Speed Limit Source
      options:
      - value: 0
        label: Car State Only
      - value: 1
        label: Map Data Only
      - value: 2
        label: Car State Priority
      - value: 3
        label: Map Data Priority
      - value: 4
        label: Combined
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Speed Limit Offset Type
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fixed
      - value: 2
        label: Percentage
    - key: SpeedLimitValueOffset
      widget: option
      title: Speed Limit Offset Value
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: Smart Cruise Control
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Vision
    description: Use vision path predictions to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlMap
    widget: toggle
    title: Map
    description: Use map data to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
