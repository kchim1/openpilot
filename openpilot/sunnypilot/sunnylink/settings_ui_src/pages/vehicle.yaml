# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: rivian
  title: Rivian Settings
  description: ''
  items:
  - key: RivianR1SWheelbase
    widget: toggle
    title: I Drive an R1S (not R1T)
    description: R1S and R1T share one wheelbase value today since there's no reliable way yet to tell them apart automatically. This defaults to the R1T's wheelbase (3.45m). Turn this on if you actually drive an R1S (3.08m) so steering calculations use the correct value. Off-road only; takes effect on your next drive.
    enablement:
    - $ref: '#/macros/offroad'
  - key: RivianOfftrackCompensationEnabled
    widget: toggle
    title: Rear-Axle Off-Tracking Compensation (R1T)
    description: Widens the commanded turn radius on tight turns to account for the R1T's long wheelbase, reducing rear-wheel curb strikes at sharp intersections. This is a geometric estimate, not curb sensing -- start conservative and validate before trusting it.
    enablement:
    - $ref: '#/macros/offroad'
    sub_items:
    - key: RivianOfftrackCompensationGain
      widget: option
      title: Compensation Gain
      description: 0 = off, 1 = full geometric compensation. Start low and increase gradually while validating.
      min: 0.0
      max: 1.0
      step: 0.05
      enablement:
      - type: param
        key: RivianOfftrackCompensationEnabled
        equals: true
  - key: RivianForceTorqueSteering
    widget: toggle
    title: Torque-Only Steering (Testing)
    description: Steers on the torque channel for the whole drive instead of the angle channel. For collecting torque calibration data on a truck with the angle upgrade. Steering is weaker than in angle mode, especially in tight turns, so keep your hands on the wheel. Off-road only; takes effect on your next drive.
    enablement:
    - $ref: '#/macros/offroad'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
